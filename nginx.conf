server {
    listen 80;
    root /usr/share/nginx/html;

    # API calls go to the gateway container; the browser only ever talks to this origin.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Single-page app: unknown paths fall back to index.html for React Router.
    location / {
        try_files $uri /index.html;
    }
}
